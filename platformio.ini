; M5Stack StopWatch (ESP32-S3R8 / 1.75" AMOLED 466x466)
; 公式ドキュメント推奨設定ベース: https://docs.m5stack.com/ja/core/StopWatch

[env:m5stack-stopwatch]
platform = espressif32 @ 6.12.0
board = esp32s3box
framework = arduino
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
monitor_echo = yes
monitor_filters = send_on_enter
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    https://github.com/m5stack/M5Unified.git
    https://github.com/m5stack/M5GFX.git
    https://github.com/m5stack/M5PM1.git
    https://github.com/m5stack/M5IOE1.git
    fastled/FastLED @ 3.7.8
    tzapu/WiFiManager @ ^2.0.17
